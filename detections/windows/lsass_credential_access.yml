title: Credential Dumping Indicators Against LSASS
id: 2e6c9d38-47af-4b51-8c03-9d5f1a2e7b64
status: experimental
description: >
  Detects processes reading LSASS memory or command lines that name LSASS alongside a dumping
  utility. LSASS holds cached credential material, so a memory dump of it is a direct precursor to
  lateral movement.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Kamil Mete Yalcinkaya
date: 2026/09/09
logsource:
  product: windows
  category: process_access
detection:
  selection_target:
    winlog.event_id: 10
    process.target.name|endswith: \lsass.exe
  selection_access:
    process.access_mask|contains:
      - '0x1010'
      - '0x1410'
      - '0x143a'
  selection_tooling:
    process.command_line|contains|all:
      - lsass
    process.command_line|contains:
      - procdump
      - comsvcs.dll
      - MiniDump
      - rundll32
  filter_legitimate:
    process.executable|startswith:
      - C:\Program Files\Windows Defender\
      - C:\Windows\System32\wbem\
  condition: ((selection_target and selection_access) or selection_tooling) and not filter_legitimate
fields:
  - process.name
  - process.executable
  - process.command_line
  - process.target.name
  - user.name
investigation:
  - Treat as an incident until disproved: assume credentials on the host are exposed.
  - Identify the accessing process and whether it is a known security product.
  - Look for a dump file written near the event, and for its later exfiltration.
  - Force a password reset for accounts with sessions on that host, including service accounts.
falsepositives:
  - Endpoint protection products and crash-reporting agents legitimately open LSASS. Baseline the
    accessing image path before enabling this rule in production.
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
