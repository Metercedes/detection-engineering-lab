title: PowerShell Encoded Command Execution
id: 6f2a1c94-3d4b-4a1e-9f7c-2b8e5d10a331
status: experimental
description: >
  Detects powershell.exe invoked with an encoded command payload. Encoding is used to keep the
  real command out of the command line that defenders and logging see, and is common in loaders
  delivered by phishing documents.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
author: Kamil Mete Yalcinkaya
date: 2026/09/09
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    - process.name: powershell.exe
    - process.name: pwsh.exe
    - process.executable|endswith: \powershell.exe
  selection_flag:
    process.command_line|contains:
      - ' -enc '
      - ' -encodedcommand'
      - ' -e '
      - ' -ec '
  condition: selection_image and selection_flag
fields:
  - process.command_line
  - process.parent.name
  - user.name
  - host.name
investigation:
  - Decode the payload: the argument after -enc is Base64 of UTF-16LE text. `base64 -d | iconv -f UTF-16LE` returns the real command.
  - Identify the parent process. An Office application or a browser as parent moves this straight to incident handling.
  - Check whether the decoded command reaches the network, and pivot on that host or URL across the estate.
  - Confirm whether the account normally runs PowerShell at all.
falsepositives:
  - Configuration management and deployment tooling that wraps PowerShell payloads, notably SCCM
    and some backup agents. Baseline the parent process before alerting.
level: high
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
